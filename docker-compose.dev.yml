# ── Development Docker Compose ──
#
# WHAT THIS RUNS:
# 1. api:       FastAPI backend (with hot-reload for development)
# 2. qdrant:    Vector database (dense + sparse vectors, server-side RRF)
# 3. redis:     Response cache
#
# Qdrant runs as its own service rather than embedded in the API process.
# That is what allows more than one uvicorn worker: the previous embedded
# ChromaDB held a local SQLite file that a second process could not safely
# open, so the API was pinned to --workers 1.
#
# PostgreSQL is not needed for dev (we use SQLite for job/document metadata)
#
# HOW TO USE:
#   docker compose -f docker-compose.dev.yml up
#
# OR for local development without Docker:
#   pip install -r backend/requirements.txt
#   uvicorn backend.app.main:app --reload --port 8000
#
# TEACHING POINT — Why docker-compose for dev:
# "Works on my machine" is the #1 cause of deployment bugs.
# Docker Compose ensures every developer runs the same:
#   - Python version
#   - System libraries
#   - Redis version
#   - Environment variables
# If it works in docker-compose, it works in production.

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: kerala-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - REDIS_URL=redis://redis:6379/0
      - CONTENT_DIR=data
      - QDRANT_URL=http://qdrant:6333
    env_file:
      - .env
    volumes:
      # Mount source code for hot-reload in development
      - ./backend:/app/backend
      - ./src:/app/src
      - ./data:/app/data:ro
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
    # Override CMD for development (--reload watches for code changes)
    command: >
      uvicorn backend.app.main:app
      --host 0.0.0.0 --port 8000
      --reload --reload-dir backend
      --log-level info
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
        reservations:
          cpus: '1'
          memory: 1.5G

  qdrant:
    # Pinned: Qdrant's storage format and Query API have both moved across
    # minor versions. An unpinned tag turns a `docker compose pull` into an
    # unplanned migration.
    image: qdrant/qdrant:v1.12.4
    container_name: kerala-qdrant
    ports:
      - "6333:6333"   # REST + web dashboard at http://localhost:6333/dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kerala-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - redis_data:/data

volumes:
  redis_data:
  qdrant_data:
